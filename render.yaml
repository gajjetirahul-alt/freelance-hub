services:
  - type: web
    name: freelancehub-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /api/projects
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
